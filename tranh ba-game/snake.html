<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<meta name="description" content="Classic snake game: eat food, grow longer, and avoid hitting the walls or yourself.">
<title>Snake - Tranh Bá Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0f0c29;
  --cyan: #00d9ff;
  --purple: #a855f7;
  --gold: #ffd700;
  --text: #ffffff;
  --muted: #9a9ab5;
}

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
  gap: 14px;
  touch-action: manipulation;
}

header {
  width: 100%;
  max-width: 520px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

h1 {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(90deg, var(--gold), var(--cyan));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.stats { display: flex; gap: 8px; }

.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 70px;
  padding: 6px 12px;
  border-radius: 12px;
  background: rgba(0, 217, 255, 0.08);
  border: 1.5px solid rgba(0, 217, 255, 0.35);
}

.stat span:first-child {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
}

.stat strong {
  font-family: 'Courier New', monospace;
  font-size: 20px;
  color: var(--gold);
}

.board-wrap {
  position: relative;
  width: 100%;
  max-width: 520px;
  aspect-ratio: 1 / 1;
  border-radius: 16px;
  overflow: hidden;
  border: 2px solid rgba(0, 217, 255, 0.4);
  box-shadow: 0 0 40px rgba(0, 217, 255, 0.2);
  background: #0a0820;
}

canvas { display: block; width: 100%; height: 100%; }

.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 20px;
  text-align: center;
  background: rgba(10, 8, 32, 0.82);
  backdrop-filter: blur(4px);
}

.overlay[hidden] { display: none; }

.overlay h2 { font-size: 32px; font-weight: 900; }
.overlay p { color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 320px; }
.overlay .final { color: var(--gold); font-size: 18px; font-weight: bold; }

button {
  font: inherit;
  cursor: pointer;
  border: none;
  color: var(--text);
}

.btn-primary {
  padding: 12px 30px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
  transition: transform 0.2s;
}

.btn-primary:hover { transform: translateY(-2px) scale(1.03); }
.btn-primary:focus-visible, .pad button:focus-visible, .toolbar button:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}

.toolbar {
  width: 100%;
  max-width: 520px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  color: var(--muted);
}

.toolbar button {
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: bold;
  color: var(--purple);
  background: rgba(168, 85, 247, 0.1);
  border: 1.5px solid rgba(168, 85, 247, 0.5);
}

.toolbar a { color: var(--cyan); text-decoration: none; font-weight: bold; }

kbd {
  font-family: 'Courier New', monospace;
  padding: 1px 6px;
  border-radius: 4px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: var(--text);
}

.pad {
  display: grid;
  grid-template-columns: repeat(3, 60px);
  grid-template-rows: repeat(2, 60px);
  gap: 8px;
}

.pad button {
  border-radius: 14px;
  font-size: 22px;
  background: rgba(0, 217, 255, 0.1);
  border: 1.5px solid rgba(0, 217, 255, 0.4);
  color: var(--cyan);
  display: flex;
  align-items: center;
  justify-content: center;
}

.pad button:active { background: rgba(0, 217, 255, 0.3); }
.pad .up { grid-column: 2; grid-row: 1; }
.pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 2; }
.pad .right { grid-column: 3; grid-row: 2; }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}

@media (hover: hover) and (pointer: fine) {
  .pad { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>SNAKE</h1>
  <div class="stats">
    <div class="stat"><span>Score</span><strong id="score">0</strong></div>
    <div class="stat"><span>Best</span><strong id="best">0</strong></div>
  </div>
</header>

<main class="board-wrap">
  <canvas id="board" width="520" height="520" aria-label="Snake game board" role="img"></canvas>

  <div class="overlay" id="overlay">
    <h2 id="overlayTitle">Ready?</h2>
    <p id="overlayText">Eat the glowing food to grow longer. Avoid the walls and your own tail.</p>
    <p class="final" id="overlayScore" hidden></p>
    <button class="btn-primary" id="startBtn" type="button">Start game</button>
  </div>
</main>

<div class="toolbar">
  <span><kbd>Arrows</kbd>/<kbd>WASD</kbd> move &middot; <kbd>Space</kbd> pause</span>
  <button type="button" id="pauseBtn" disabled>Pause</button>
</div>

<nav class="pad" aria-label="Direction controls">
  <button type="button" class="up" data-dir="up" aria-label="Move up"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 5l8 12H4z"/></svg></button>
  <button type="button" class="left" data-dir="left" aria-label="Move left"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 12l12-8v16z"/></svg></button>
  <button type="button" class="down" data-dir="down" aria-label="Move down"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 19L4 7h16z"/></svg></button>
  <button type="button" class="right" data-dir="right" aria-label="Move right"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 12L7 20V4z"/></svg></button>
</nav>

<p class="sr-only" id="live" aria-live="polite"></p>

<script>
(() => {
  const GRID = 20;
  const START_SPEED_MS = 140;
  const MIN_SPEED_MS = 60;
  const SPEED_STEP_MS = 4;
  const BEST_KEY = 'snake-best-score';

  const DIRS = {
    up: { x: 0, y: -1 },
    down: { x: 0, y: 1 },
    left: { x: -1, y: 0 },
    right: { x: 1, y: 0 },
  };

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const overlayScore = document.getElementById('overlayScore');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const live = document.getElementById('live');

  let snake, dir, queuedDirs, food, score, speed, state, lastTick, rafId;
  let best = Number(localStorage.getItem(BEST_KEY)) || 0;
  bestEl.textContent = best;

  function setupCanvas() {
    const size = canvas.getBoundingClientRect().width;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    draw();
  }

  function reset() {
    const mid = Math.floor(GRID / 2);
    snake = [
      { x: mid, y: mid },
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
    ];
    dir = DIRS.right;
    queuedDirs = [];
    score = 0;
    speed = START_SPEED_MS;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function queueDirection(name) {
    const next = DIRS[name];
    if (!next) return;
    if (state === 'ready' || state === 'over') { start(); }
    const last = queuedDirs.length ? queuedDirs[queuedDirs.length - 1] : dir;
    const isReverse = next.x === -last.x && next.y === -last.y;
    if (next === last || isReverse || queuedDirs.length >= 3) return;
    queuedDirs.push(next);
  }

  function step() {
    if (queuedDirs.length) dir = queuedDirs.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const eating = food && head.x === food.x && head.y === food.y;
    const body = eating ? snake : snake.slice(0, -1);

    const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
    const hitSelf = body.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) return gameOver();

    snake.unshift(head);
    if (eating) {
      score += 1;
      scoreEl.textContent = score;
      speed = Math.max(MIN_SPEED_MS, speed - SPEED_STEP_MS);
      placeFood();
      if (!food) return gameOver(true);
    } else {
      snake.pop();
    }
  }

  function loop(time) {
    if (state !== 'playing') return;
    if (time - lastTick >= speed) {
      lastTick = time;
      step();
    }
    draw();
    rafId = requestAnimationFrame(loop);
  }

  function start() {
    reset();
    state = 'playing';
    overlay.hidden = true;
    pauseBtn.disabled = false;
    pauseBtn.textContent = 'Pause';
    lastTick = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      cancelAnimationFrame(rafId);
      pauseBtn.textContent = 'Resume';
      showOverlay('Paused', 'Press Space or Resume to keep going.', null, 'Resume');
    } else if (state === 'paused') {
      state = 'playing';
      overlay.hidden = true;
      pauseBtn.textContent = 'Pause';
      lastTick = performance.now();
      rafId = requestAnimationFrame(loop);
    }
  }

  function gameOver(won = false) {
    state = 'over';
    cancelAnimationFrame(rafId);
    pauseBtn.disabled = true;
    const isBest = score > best;
    if (isBest) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem(BEST_KEY, String(best));
    }
    draw();
    showOverlay(
      won ? 'You win!' : 'Game over',
      won ? 'You filled the entire board.' : 'Press any arrow key or Play again to restart.',
      `Score: ${score}${isBest && score > 0 ? ' - New best!' : ''}`,
      'Play again'
    );
    live.textContent = `Game over. Final score ${score}.`;
  }

  function showOverlay(title, text, scoreText, buttonLabel) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlayScore.hidden = !scoreText;
    overlayScore.textContent = scoreText || '';
    startBtn.textContent = buttonLabel;
    overlay.hidden = false;
    startBtn.focus({ preventScroll: true });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
    ctx.fill();
  }

  function draw() {
    if (!snake) return;
    const cell = canvas.width / GRID;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.025)';
    for (let y = 0; y < GRID; y++) {
      for (let x = (y % 2); x < GRID; x += 2) {
        ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }

    if (food) {
      const pulse = 0.8 + Math.sin(performance.now() / 180) * 0.1;
      const cx = food.x * cell + cell / 2;
      const cy = food.y * cell + cell / 2;
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = cell * 0.8;
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(cx, cy, (cell / 2) * pulse * 0.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    const len = snake.length;
    snake.forEach((seg, i) => {
      const t = len > 1 ? i / (len - 1) : 0;
      const r = Math.round(0 + (168 - 0) * t);
      const g = Math.round(217 + (85 - 217) * t);
      const b = Math.round(255 + (247 - 255) * t);
      ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
      if (i === 0) {
        ctx.shadowColor = '#00d9ff';
        ctx.shadowBlur = cell * 0.6;
      }
      const pad = cell * 0.08;
      roundRect(seg.x * cell + pad, seg.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.28);
      ctx.shadowBlur = 0;
    });

    const head = snake[0];
    const eyeR = cell * 0.09;
    const cx = head.x * cell + cell / 2;
    const cy = head.y * cell + cell / 2;
    const off = cell * 0.2;
    const px = -dir.y, py = dir.x;
    ctx.fillStyle = '#0a0820';
    [1, -1].forEach(side => {
      ctx.beginPath();
      ctx.arc(cx + dir.x * off + px * off * side, cy + dir.y * off + py * off * side, eyeR, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  const KEY_MAP = {
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
  };

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'KeyP') {
      if (state === 'playing' || state === 'paused') {
        e.preventDefault();
        togglePause();
      }
      return;
    }
    const name = KEY_MAP[e.code];
    if (!name) return;
    e.preventDefault();
    if (state === 'paused') togglePause();
    queueDirection(name);
  });

  startBtn.addEventListener('click', () => {
    if (state === 'paused') togglePause();
    else start();
  });
  pauseBtn.addEventListener('click', togglePause);

  document.querySelectorAll('.pad button').forEach(btn => {
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (state === 'paused') togglePause();
      queueDirection(btn.dataset.dir);
    });
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    queueDirection(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') togglePause();
  });

  window.addEventListener('resize', setupCanvas);

  state = 'ready';
  reset();
  setupCanvas();
})();
</script>
</body>
</html>
