<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💬 Forum Chat - Tranh Bá Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
height: 100%;
overflow: hidden;
}

body {
font-family: 'Segoe UI', Arial, sans-serif;
background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
color: #fff;
display: flex;
flex-direction: column;
height: 100vh;
}

/* === HEADER === */
header {
flex-shrink: 0;
padding: 12px 20px;
background: rgba(15, 12, 41, 0.85);
backdrop-filter: blur(10px);
border-bottom: 1px solid rgba(0, 217, 255, 0.2);
display: flex;
align-items: center;
gap: 15px;
z-index: 10;
}

.logo {
font-size: 22px;
font-weight: bold;
background: linear-gradient(90deg, #00d9ff, #a855f7);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
letter-spacing: 1px;
flex-shrink: 0;
}

.status {
display: flex;
align-items: center;
gap: 6px;
font-size: 12px;
color: #888;
flex: 1;
}

.dot {
width: 8px;
height: 8px;
border-radius: 50%;
background: #00ff88;
box-shadow: 0 0 8px #00ff88;
animation: blink 2s ease-in-out infinite;
}

@keyframes blink {
0%, 100% { opacity: 1; }
50% { opacity: 0.4; }
}

.nav-buttons {
display: flex;
gap: 8px;
flex-shrink: 0;
}

.nav-btn {
display: inline-flex;
align-items: center;
gap: 6px;
padding: 8px 16px;
background: rgba(0, 217, 255, 0.1);
border: 1px solid rgba(0, 217, 255, 0.4);
color: #00d9ff;
text-decoration: none;
font-size: 13px;
font-weight: bold;
border-radius: 20px;
transition: all 0.25s ease;
white-space: nowrap;
}

.nav-btn:hover {
background: #00d9ff;
color: #000;
box-shadow: 0 0 15px rgba(0, 217, 255, 0.6);
transform: translateY(-2px);
}

.nav-btn.intro {
background: rgba(168, 85, 247, 0.1);
border-color: rgba(168, 85, 247, 0.4);
color: #a855f7;
}

.nav-btn.intro:hover {
background: #a855f7;
color: #fff;
box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
}

/* === KHU VỰC CHAT === */
.chat-wrapper {
flex: 1;
overflow-y: auto;
padding: 20px;
scroll-behavior: smooth;
}

.chat-wrapper::-webkit-scrollbar { width: 8px; }
.chat-wrapper::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
.chat-wrapper::-webkit-scrollbar-thumb {
background: linear-gradient(#00d9ff, #a855f7);
border-radius: 4px;
}

.chat-container {
max-width: 900px;
margin: 0 auto;
display: flex;
flex-direction: column;
gap: 10px;
}

.msg {
display: flex;
flex-direction: column;
padding: 10px 14px;
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.08);
border-left: 3px solid #00d9ff;
border-radius: 10px;
animation: msgIn 0.3s ease;
word-wrap: break-word;
max-width: 100%;
}

@keyframes msgIn {
from { opacity: 0; transform: translateY(10px); }
to { opacity: 1; transform: translateY(0); }
}

.msg .head {
display: flex;
align-items: center;
gap: 8px;
margin-bottom: 5px;
font-size: 12px;
}

.msg .avatar {
width: 26px;
height: 26px;
border-radius: 50%;
background: linear-gradient(135deg, #00d9ff, #a855f7);
display: flex;
align-items: center;
justify-content: center;
font-size: 14px;
flex-shrink: 0;
}

.msg .name {
font-weight: bold;
color: #00d9ff;
font-size: 12.5px;
}

.msg .time {
color: #666;
font-size: 11px;
font-family: 'Courier New', monospace;
margin-left: auto;
}

.msg .text {
color: #ddd;
font-size: 14px;
line-height: 1.5;
word-break: break-word;
}

/* Thông báo hệ thống */
.msg.system {
background: rgba(255, 215, 0, 0.08);
border-left-color: #ffd700;
text-align: center;
font-style: italic;
color: #ffd700;
font-size: 13px;
padding: 8px 14px;
}

.msg.system .text {
color: #ffd700;
font-size: 13px;
}

/* Tin nhắn bị cảnh báo */
.msg.warned {
background: rgba(255, 107, 107, 0.08);
border-left-color: #ff6b6b;
}

.msg.warned .name { color: #ff6b6b; }

.warn-badge {
display: inline-block;
margin-top: 6px;
padding: 3px 8px;
background: rgba(255, 107, 107, 0.15);
border: 1px solid rgba(255, 107, 107, 0.5);
color: #ff6b6b;
font-size: 10.5px;
font-weight: bold;
border-radius: 4px;
letter-spacing: 0.5px;
}

/* Tin nhắn bot trả lời tự động */
.msg.bot {
background: rgba(0, 217, 255, 0.06);
border-left-color: #00d9ff;
animation: botIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes botIn {
from { opacity: 0; transform: translateY(15px) scale(0.95); }
to { opacity: 1; transform: translateY(0) scale(1); }
}

.msg.bot .name { color: #00d9ff; }
.msg.bot .avatar {
background: linear-gradient(135deg, #00d9ff, #00b4ff);
animation: botPulse 2s ease-in-out infinite;
}

@keyframes botPulse {
0%, 100% { box-shadow: 0 0 0 0 rgba(0, 217, 255, 0.6); }
50% { box-shadow: 0 0 0 6px rgba(0, 217, 255, 0); }
}

/* Hiệu ứng "đang gõ" */
.msg.typing .text {
display: flex;
align-items: center;
gap: 4px;
height: 20px;
}

.typing-dot {
width: 6px;
height: 6px;
border-radius: 50%;
background: #00d9ff;
animation: typingBounce 1.4s ease-in-out infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
30% { transform: translateY(-6px); opacity: 1; }
}

/* === Ô NHẬP === */
.input-area {
flex-shrink: 0;
padding: 12px 20px 15px;
background: rgba(15, 12, 41, 0.9);
backdrop-filter: blur(10px);
border-top: 1px solid rgba(0, 217, 255, 0.2);
}

.input-inner {
max-width: 900px;
margin: 0 auto;
display: flex;
gap: 10px;
align-items: flex-end;
}

.input-box {
flex: 1;
position: relative;
}

textarea {
width: 100%;
min-height: 44px;
max-height: 120px;
padding: 12px 45px 12px 16px;
background: rgba(255, 255, 255, 0.05);
border: 1.5px solid rgba(0, 217, 255, 0.3);
border-radius: 22px;
color: #fff;
font-size: 14px;
font-family: inherit;
resize: none;
outline: none;
line-height: 1.4;
transition: all 0.2s;
}

textarea:focus {
border-color: #00d9ff;
background: rgba(255, 255, 255, 0.08);
box-shadow: 0 0 15px rgba(0, 217, 255, 0.25);
}

textarea::placeholder { color: #666; }

.char-count {
position: absolute;
bottom: 6px;
right: 15px;
font-size: 10.5px;
color: #666;
font-family: 'Courier New', monospace;
pointer-events: none;
}

.char-count.warn { color: #ffd700; }
.char-count.danger { color: #ff6b6b; font-weight: bold; }

.send-btn {
flex-shrink: 0;
width: 48px;
height: 48px;
border-radius: 50%;
background: linear-gradient(135deg, #00d9ff, #a855f7);
border: none;
color: #fff;
font-size: 20px;
cursor: pointer;
transition: all 0.25s ease;
display: flex;
align-items: center;
justify-content: center;
box-shadow: 0 6px 20px rgba(0, 217, 255, 0.4);
}

.send-btn:hover {
transform: scale(1.1) rotate(15deg);
box-shadow: 0 8px 28px rgba(0, 217, 255, 0.8);
}

.send-btn:active { transform: scale(0.95) rotate(15deg); }

.send-btn:disabled {
opacity: 0.4;
cursor: not-allowed;
transform: none;
}

/* === HINT DƯỚI INPUT === */
.hint-bar {
max-width: 900px;
margin: 8px auto 0;
display: flex;
justify-content: space-between;
font-size: 11px;
color: #666;
font-family: 'Courier New', monospace;
}

.hint-bar .warn-text { color: #ffd700; }
.hint-bar .danger-text { color: #ff6b6b; }

/* === RESPONSIVE === */
@media (max-width: 600px) {
header { padding: 10px 12px; gap: 8px; }
.logo { font-size: 17px; }
.status { display: none; }
.nav-btn { padding: 6px 11px; font-size: 11.5px; gap: 4px; }
.nav-btn span:not(.icon) { display: none; }
.nav-btn .icon { font-size: 14px; }
.chat-wrapper { padding: 12px; }
.input-area { padding: 10px 12px 12px; }
textarea { font-size: 13px; padding: 10px 40px 10px 14px; }
.send-btn { width: 42px; height: 42px; font-size: 17px; }
.msg .text { font-size: 13px; }
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
<div class="logo">💬 FORUM CHAT</div>
<div class="status">
<span class="dot"></span>
<span>Đang hoạt động · Tất cả là khách</span>
</div>
<div class="nav-buttons">
<a href="index.html" class="nav-btn">
<span class="icon">🏠</span>
<span>Trang chủ</span>
</a>
<a href="gioithieu.html" class="nav-btn intro">
<span class="icon">🌸</span>
<span>Giới thiệu</span>
</a>
</div>
</header>

<!-- ===== KHU VỰC CHAT ===== -->
<div class="chat-wrapper" id="chatWrapper">
<div class="chat-container" id="chatContainer">
<!-- Tin nhắn sẽ được render ở đây -->
</div>
</div>

<!-- ===== Ô NHẬP ===== -->
<div class="input-area">
<div class="input-inner">
<div class="input-box">
<textarea
id="msgInput"
placeholder="Nhập tin nhắn... (Enter để gửi, Shift+Enter xuống dòng)"
maxlength="500"
rows="1"
></textarea>
<span class="char-count" id="charCount">0/500</span>
</div>
<button class="send-btn" id="sendBtn" title="Gửi (Enter)" disabled>➤</button>
</div>
<div class="hint-bar">
<span>👥 Tất cả người dùng đều là <b>Khách</b></span>
<span id="hintText">🚧 Khung chat demo — đang phát triển</span>
</div>
</div>

<script>
/* ============================================
💬 FORUM CHAT - LOGIC (BẢN DEMO)
============================================ */

// === CẤU HÌNH ===
var MAX_MSG_LENGTH = 500;
var STORAGE_KEY = 'forum_chat_msgs';

// Từ nhạy cảm
var SENSITIVE_WORDS = [
'dm', 'dmm', 'đm', 'đmm', 'dkm', 'đkm',
'cl', 'clm', 'vcl', 'vl', 'vkl',
'cặc', 'lồn', 'buồi', 'đít', 'chim',
'địt', 'đụ', 'chịch', 'sex',
'ngu', 'khốn', 'chó chết', 'đồ chó',
'fuck', 'shit', 'bitch', 'dick'
];

// Emoji ngẫu nhiên cho avatar
var AVATARS = ['😀','😎','🤖','🐱','🐶','🦊','🐼','🦉','🐧','🐸','🐙','🦋','🌟','🎮','🚀','💎'];

// ==== 🤖 BOT TRẢ LỜI TỰ ĐỘNG ====
// Danh sách các câu trả lời tự động (random)
var BOT_REPLIES = [
'Cảm ơn bạn đã ghé thăm! Khung chat này đang được xây dựng, chưa hoàn thiện đâu nha 🚧',
'Hiện tại mình chỉ là bot demo thôi, chưa có ai thật trả lời bạn cả 😅',
'Tranh Bá Game đang trong giai đoạn phát triển. Bạn quay lại sau nhé! 🌱',
'Cảm ơn bạn! Chat thật sẽ sớm hoạt động — hãy kiên nhẫn chờ nha! ⏳',
'Góp ý của bạn rất quý giá! Mình sẽ chuyển đến người phát triển 💌',
'Khung chat này đang được viết dở, bạn thông cảm nha 🙏',
'Rất vui được gặp bạn! Sắp có chat thật rồi, chờ xíu nhé ⭐',
'Bạn là người dùng thứ N của ngày hôm nay! Cảm ơn vì đã ghé 👋'
];

// Bot nhận diện một số từ khoá → trả lời theo ngữ cảnh
var BOT_KEYWORDS = [
{ keys: ['chào', 'hello', 'hi', 'xin chào', 'hí'], reply: 'Chào bạn! Mình là bot demo của Tranh Bá Game. Khung chat này đang phát triển nha 🤖✨' },
{ keys: ['game', 'chơi', 'trò'], reply: 'Bên mình có Rắn Cổ Điển, Rắn Ăn Chữ, và Giao Nhan Player đó! Bạn vào trang chủ xem thử nha 🎮' },
{ keys: ['nhạc', 'music', 'hát', 'player', 'nốt'], reply: 'À, Giao Nhan Player! Bạn gõ nốt kiểu 2C5 4A4 là nghe được nhạc đó 🎵' },
{ keys: ['admin', 'chủ', 'quản trị', 'owner'], reply: 'Chủ sân chơi là anh Hoài — nhưng hiện tại ảnh chưa online, bạn để lại lời nhắn nha 📩' },
{ keys: ['cảm ơn', 'thank', 'cám ơn', 'tks'], reply: 'Dạ không có chi! Góp ý thêm cho mình nhé 💖' },
{ keys: ['lỗi', 'bug', 'sai', 'hỏng'], reply: 'Ồ, nếu bạn thấy lỗi thì cho mình xin mô tả cụ thể nhé! Mình sẽ gửi đến người phát triển 🐛' },
{ keys: ['ai', 'bot', 'robot'], reply: 'Đúng rồi, mình là bot tự động! Chưa có người thật trả lời bạn đâu 🤖' }
];


// === BIẾN TOÀN CỤC ===
var messages = [];
var chatContainer = document.getElementById('chatContainer');
var chatWrapper = document.getElementById('chatWrapper');
var msgInput = document.getElementById('msgInput');
var sendBtn = document.getElementById('sendBtn');
var charCount = document.getElementById('charCount');
var hintText = document.getElementById('hintText');


/* ============================================
🔧 HÀM TIỆN ÍCH
============================================ */

function removeDiacritics(str) {
return str
.normalize('NFD')
.replace(/[\u0300-\u036f]/g, '')
.replace(/đ/g, 'd')
.replace(/Đ/g, 'D')
.toLowerCase();
}

// Kiểm tra từ nhạy cảm — dùng regex ranh giới từ để tránh bắt oan
function checkSensitive(text) {
var normalized = removeDiacritics(text);
for (var i = 0; i < SENSITIVE_WORDS.length; i++) {
var bad = removeDiacritics(SENSITIVE_WORDS[i]).replace(/[^a-z0-9]/g, '');
var regex = new RegExp('(?:^|[^a-z0-9])' + bad + '(?:$|[^a-z0-9])', 'i');
if (regex.test(normalized)) return SENSITIVE_WORDS[i];
}
return null;
}

function getTimeNow() {
var d = new Date();
var hh = String(d.getHours()).padStart(2, '0');
var mm = String(d.getMinutes()).padStart(2, '0');
var ss = String(d.getSeconds()).padStart(2, '0');
var dd = String(d.getDate()).padStart(2, '0');
var mo = String(d.getMonth() + 1).padStart(2, '0');
var yy = d.getFullYear();
return hh + ':' + mm + ':' + ss + ' ' + dd + '/' + mo + '/' + yy;
}

function escapeHtml(str) {
return str
.replace(/&/g, '&amp;')
.replace(/</g, '&lt;')
.replace(/>/g, '&gt;')
.replace(/"/g, '&quot;')
.replace(/'/g, '&#39;');
}


/* ============================================
💾 LƯU / ĐỌC LOCALSTORAGE
============================================ */

function saveMessages() {
try {
var toSave = messages.slice(-200);
localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
} catch (e) {
console.warn('Không lưu được tin nhắn:', e);
}
}

function loadMessages() {
try {
var raw = localStorage.getItem(STORAGE_KEY);
if (raw) messages = JSON.parse(raw) || [];
} catch (e) {
messages = [];
}
}


/* ============================================
🎨 RENDER
============================================ */

function renderOneMessage(msg) {
var el = document.createElement('div');
el.className = 'msg';

// Tin nhắn hệ thống
if (msg.type === 'system') {
el.classList.add('system');
el.innerHTML = '<div class="text">' + escapeHtml(msg.text) + '</div>' +
'<div class="head" style="justify-content:flex-end;margin:2px 0 0;"><span class="time">' + msg.time + '</span></div>';
return el;
}

// Bot
if (msg.type === 'bot') {
el.classList.add('bot');
}

// Tin nhắn có từ nhạy cảm
if (msg.warned) {
el.classList.add('warned');
}

var avatar = escapeHtml(msg.avatar || '😀');
var name = escapeHtml(msg.name || 'Khách');
var text = escapeHtml(msg.text);
var time = msg.time;

var html =
'<div class="head">' +
'<div class="avatar">' + avatar + '</div>' +
'<span class="name">' + name + '</span>' +
'<span class="time">' + time + '</span>' +
'</div>' +
'<div class="text">' + text + '</div>';

if (msg.warned) {
html += '<span class="warn-badge">⚠️ Tin nhắn chứa từ nhạy cảm</span>';
}

el.innerHTML = html;
return el;
}

function renderAll() {
chatContainer.innerHTML = '';
for (var i = 0; i < messages.length; i++) {
chatContainer.appendChild(renderOneMessage(messages[i]));
}
scrollToBottom();
}

function appendMessage(msg) {
messages.push(msg);
chatContainer.appendChild(renderOneMessage(msg));
scrollToBottom();
saveMessages();
}

// Hiệu ứng "đang gõ" tạm thời → trả về element để xoá sau
function showTypingIndicator() {
var el = document.createElement('div');
el.className = 'msg bot typing';
el.innerHTML =
'<div class="head">' +
'<div class="avatar">🤖</div>' +
'<span class="name">Bot</span>' +
'<span class="time">' + getTimeNow() + '</span>' +
'</div>' +
'<div class="text">' +
'<span class="typing-dot"></span>' +
'<span class="typing-dot"></span>' +
'<span class="typing-dot"></span>' +
'</div>';
chatContainer.appendChild(el);
scrollToBottom();
return el;
}

function scrollToBottom() {
requestAnimationFrame(function () {
chatWrapper.scrollTop = chatWrapper.scrollHeight;
});
}


/* ============================================
🤖 BOT TRẢ LỜI
============================================ */

// Tìm câu trả lời phù hợp với tin nhắn của khách
function getBotReply(userText) {
var normalized = removeDiacritics(userText).toLowerCase();
for (var i = 0; i < BOT_KEYWORDS.length; i++) {
for (var j = 0; j < BOT_KEYWORDS[i].keys.length; j++) {
if (normalized.indexOf(BOT_KEYWORDS[i].keys[j]) !== -1) {
return BOT_KEYWORDS[i].reply;
}
}
}
// Nếu không khớp keyword → random
return BOT_REPLIES[Math.floor(Math.random() * BOT_REPLIES.length)];
}

function botReply(userText) {
// 1. Hiện "đang gõ..."
var typingEl = showTypingIndicator();

// 2. Sau 1-1.8s → xoá "đang gõ", hiện câu trả lời thật
var delay = 1000 + Math.random() * 800;
setTimeout(function () {
if (typingEl && typingEl.parentNode) {
typingEl.parentNode.removeChild(typingEl);
}

var reply = getBotReply(userText);
appendMessage({
type: 'bot',
name: 'Bot',
avatar: '🤖',
text: reply,
time: getTimeNow()
});
}, delay);
}


/* ============================================
🚀 GỬI TIN NHẮN
============================================ */

function sendMessage() {
var text = msgInput.value.trim();
if (!text) return;

if (text.length > MAX_MSG_LENGTH) {
text = text.substring(0, MAX_MSG_LENGTH);
}

// Kiểm tra từ nhạy cảm
var badWord = checkSensitive(text);
var warned = badWord !== null;

// Tạo tin nhắn mới
var msg = {
type: 'user',
name: 'Khách',
avatar: AVATARS[Math.floor(Math.random() * AVATARS.length)],
text: text,
time: getTimeNow(),
warned: warned
};

appendMessage(msg);

// Nếu có từ nhạy cảm → tin hệ thống cảnh báo
if (warned) {
setTimeout(function () {
appendMessage({
type: 'system',
text: '⚠️ CẢNH BÁO: Tin nhắn vừa gửi chứa từ ngữ không phù hợp. Vui lòng giữ không khí thân thiện! 💖',
time: getTimeNow()
});
}, 300);
}

// Xoá ô nhập
resetInput();

// 🤖 Bot trả lời tự động sau khi khách gửi
botReply(text);
}


/* ============================================
📝 Ô NHẬP - UI
============================================ */

function resetInput() {
msgInput.value = '';
msgInput.style.height = '44px';
updateCharCount();
msgInput.focus();
}

function updateCharCount() {
var len = msgInput.value.length;
charCount.textContent = len + '/' + MAX_MSG_LENGTH;
charCount.className = 'char-count';
if (len >= MAX_MSG_LENGTH) charCount.classList.add('danger');
else if (len >= MAX_MSG_LENGTH * 0.8) charCount.classList.add('warn');

sendBtn.disabled = len === 0;
}

function autoResize() {
msgInput.style.height = 'auto';
msgInput.style.height = Math.min(120, msgInput.scrollHeight) + 'px';
}


/* ============================================
🎯 EVENT LISTENERS
============================================ */

msgInput.addEventListener('input', function () {
updateCharCount();
autoResize();
});

msgInput.addEventListener('keydown', function (e) {
if (e.key === 'Enter' && !e.shiftKey) {
e.preventDefault();
sendMessage();
}
});

sendBtn.addEventListener('click', sendMessage);


/* ============================================
🚀 KHỞI ĐỘNG
============================================ */

loadMessages();

// Nếu chưa có tin nhắn → tạo tin chào mừng
if (messages.length === 0) {
messages.push({
type: 'system',
text: '👋 Chào mừng bạn đến với Forum Chat Tranh Bá Game!',
time: getTimeNow()
});
messages.push({
type: 'system',
text: '🚧 Đây là khung chat DEMO — chưa có người dùng thật, chỉ có BOT trả lời tự động.',
time: getTimeNow()
});
messages.push({
type: 'system',
text: '💡 Bạn cứ nhắn thử, BOT sẽ trả lời để bạn biết giao diện hoạt động ra sao nhé!',
time: getTimeNow()
});
saveMessages();
}

renderAll();
updateCharCount();
autoResize();
sendBtn.disabled = true;
msgInput.focus();
</script>
